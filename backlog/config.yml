project_name: "Night Shift"
default_status: "Queued"
statuses: ["Queued", "Active", "Review", "Ready", "Done"]
labels: ["night-ready", "blocked", "triage", "external", "app", "cli", "protocol", "practices", "templates", "release", "ci"]
types: ["bug", "feature", "enhancement", "chore", "docs", "spike"]
priorities: ["High", "Medium", "Low"]
definition_of_done:
  - "Acceptance criteria verified; the final summary records the checks run, their results and what remains unverified."
  - "npm run check passes on the integrated revision; a visible change has a screenshot someone looked at."
  - "Review gate passed (docs/practices/review.md) or the small-change path recorded in the commit."
  - "Docs, glossary, decisions and CHANGELOG are current; discovered work is tracked here without duplicates."
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
